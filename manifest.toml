id = "java-syntax"
name = "Java"
version = "0.0.1"
abi = "1.12"
tags = ["syntax", "java"]
# A language and nothing else: no module of its own and no pane. The grammar is the file the
# installer downloads and checks.

[language]
name = "Java"
grammar = "java.wasm"
extensions = ["java"]
comment = "//"
# The query is the grammar's own (queries/highlights.scm of https://github.com/tree-sitter/tree-sitter-java, v0.23.5 (94703d5)).
# The patterns are in the opposite order of the grammar's file: TerminalCode takes the first of two
# patterns on the same text, and that file is written for the last (as Neovim and Zed take it).
highlights = '''
; Keywords

[
  "abstract"
  "assert"
  "break"
  "case"
  "catch"
  "class"
  "continue"
  "default"
  "do"
  "else"
  "enum"
  "exports"
  "extends"
  "final"
  "finally"
  "for"
  "if"
  "implements"
  "import"
  "instanceof"
  "interface"
  "module"
  "native"
  "new"
  "non-sealed"
  "open"
  "opens"
  "package"
  "permits"
  "private"
  "protected"
  "provides"
  "public"
  "requires"
  "record"
  "return"
  "sealed"
  "static"
  "strictfp"
  "switch"
  "synchronized"
  "throw"
  "throws"
  "to"
  "transient"
  "transitive"
  "try"
  "uses"
  "volatile"
  "when"
  "while"
  "with"
  "yield"
] @keyword

[
  (line_comment)
  (block_comment)
] @comment

[
  (true)
  (false)
  (null_literal)
] @constant.builtin

(escape_sequence) @string.escape

[
  (character_literal)
  (string_literal)
] @string

; Literals

[
  (hex_integer_literal)
  (decimal_integer_literal)
  (octal_integer_literal)
  (decimal_floating_point_literal)
  (hex_floating_point_literal)
] @number

; Builtins

(this) @variable.builtin

; Constants

((identifier) @constant
 (#match? @constant "^_*[A-Z][A-Z\\d_]+$"))

[
  (boolean_type)
  (integral_type)
  (floating_point_type)
  (floating_point_type)
  (void_type)
] @type.builtin

(constructor_declaration
  name: (identifier) @type)

((method_reference
  . (identifier) @type)
 (#match? @type "^[A-Z]"))

((method_invocation
  object: (identifier) @type)
 (#match? @type "^[A-Z]"))

((scoped_identifier
  scope: (identifier) @type)
 (#match? @type "^[A-Z]"))

((field_access
  object: (identifier) @type)
 (#match? @type "^[A-Z]"))

(enum_declaration
  name: (identifier) @type)

(class_declaration
  name: (identifier) @type)

(interface_declaration
  name: (identifier) @type)

; Types

(type_identifier) @type

"@" @operator

(marker_annotation
  name: (identifier) @attribute)

; Annotations

(annotation
  name: (identifier) @attribute)

(super) @function.builtin

(method_invocation
  name: (identifier) @function.method)

; Methods

(method_declaration
  name: (identifier) @function.method)

; Variables

(identifier) @variable
'''
